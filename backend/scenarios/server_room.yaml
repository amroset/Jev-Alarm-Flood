id: server
name: Server room at night
short: Cooling fails at 2 a.m.
start: "2026-09-12T02:08:00"
duration_s: 480
weather: "clear, 9 °C outside"
desc: >-
  Saturday 02:08. A cooling unit fails in the server room, and six minutes later the room starts heating up.
  A lighting controller in the same room goes offline in between: a decoy. Watch Jev link the temperature to
  the cooling fault, not to the lighting controller, so the on-call person gets one critical page.

